<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#312e81" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Inner Soft Border -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8" />

  <!-- Modern Financial / Accounting Chart & Flow Nodes -->
  <g transform="translate(48, 48)">
    <!-- Column 1 (Small Bar) -->
    <rect x="76" y="240" width="56" height="120" rx="20" fill="rgba(255, 255, 255, 0.45)" />

    <!-- Column 2 (Medium Bar) -->
    <rect x="160" y="170" width="56" height="190" rx="20" fill="rgba(255, 255, 255, 0.75)" />

    <!-- Column 3 (Tall Primary Bar) -->
    <rect x="244" y="90" width="56" height="270" rx="20" fill="#ffffff" />

    <!-- Growth Line Curve -->
    <path
      d="M 90 220 Q 180 150 272 70"
      fill="none"
      stroke="url(#accentGrad)"
      stroke-width="24"
      stroke-linecap="round"
    />

    <!-- Diamond / Star Peak Indicator -->
    <circle cx="272" cy="70" r="22" fill="#38bdf8" stroke="#ffffff" stroke-width="8" />
  </g>
</svg>
